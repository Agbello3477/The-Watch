[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name              tail
    Tag               zeek.conn
    Path              /usr/local/zeek/logs/current/conn.log
    Parser            zeek_json
    Refresh_Interval  1

[INPUT]
    Name              tail
    Tag               zeek.dns
    Path              /usr/local/zeek/logs/current/dns.log
    Parser            zeek_json
    Refresh_Interval  1

[INPUT]
    Name              tail
    Tag               zeek.http
    Path              /usr/local/zeek/logs/current/http.log
    Parser            zeek_json
    Refresh_Interval  1

[INPUT]
    Name              tail
    Tag               zeek.ssl
    Path              /usr/local/zeek/logs/current/ssl.log
    Parser            zeek_json
    Refresh_Interval  1

[INPUT]
    Name              tail
    Tag               zeek.files
    Path              /usr/local/zeek/logs/current/files.log
    Parser            zeek_json
    Refresh_Interval  1

[INPUT]
    Name              tail
    Tag               zeek.notice
    Path              /usr/local/zeek/logs/current/notice.log
    Parser            zeek_json
    Refresh_Interval  1

[FILTER]
    Name    record_modifier
    Match   zeek.*
    Record  sensor_node noun-hrms-zeek-tap-01

[OUTPUT]
    Name              http
    Match             zeek.*
    Host              the-watch-backend
    Port              4000
    URI               /api/soc/zeek/ingest
    Format            json
    Header            Content-Type application/json
    Header            X-Telemetry-Key tel_sec_noun_hrms_98234
