services:
  # The Watch Backend Web Service on Render
  - type: web
    name: the-watch-backend
    runtime: node
    plan: free
    region: frankfurt # Low latency to Europe/Africa
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NODE_OPTIONS
        value: --max-old-space-size=512
      - key: DATABASE_URL
        placeholder: "Paste your Neon PostgreSQL connection string here (e.g. postgresql://user:pass@ep-cool.neon.tech/neondb?sslmode=require)"
      - key: HMAC_SECRET
        generateValue: true
      - key: HOST
        value: 0.0.0.0
